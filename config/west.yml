manifest:
  defaults:
    revision: main
  remotes:
    - name: Good-Great-Grand-Wonderful
      url-base: https://github.com/Good-Great-Grand-Wonderful
  projects:
    - name: crosses-v2-zmk-firmware
      remote: Good-Great-Grand-Wonderful
      import: config/west.yml
    # Local vendored override for the pipeline-switch module.
    # Path is relative to this file (config/west.yml), so ../modules/...
    - name: zmk-input-processor-pipeline-switch
      remote: Good-Great-Grand-Wonderful
      path: modules/zmk-input-processor-pipeline-switch
  self:
    path: config

name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  debug-west-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fixed: Added space before the pipe (|)
      - name: Show repo info
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          pwd
          ls -la

      # Fixed: Added space before the pipe (|)
      - name: Print repo config/west.yml
        run: |
          echo "=== repo config/west.yml ==="
          sed -n '1,200p' config/west.yml || true

      # Fixed: Added space before the pipe (|)
      - name: Dump merged /tmp/zmk-config/config/west.yml and search
        run: |
          echo "=== merged /tmp/zmk-config/config/west.yml (if present) ==="
          if [ -f /tmp/zmk-config/config/west.yml ]; then
            sed -n '1,400p' /tmp/zmk-config/config/west.yml || true
          else
            echo "/tmp/zmk-config/config/west.yml not present at this step"
          fi
          echo
          echo "=== Search for pipeline switch references in repo ==="
          git grep -n "zmk-input-processor-pipeline-switch" || true
          git grep -n "../modules/zmk-input-processor-pipeline-switch" || true

  build:
    needs: debug-west-manifest
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

